<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>策略看板</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="策略看板">
    <meta name="theme-color" content="#0e0e10">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- 圖示（線條風格，全站共用） -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></symbol>
        <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></symbol>
        <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
        <symbol id="i-sort" viewBox="0 0 24 24"><path d="M3 6h18M6 12h12M9 18h6"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-2.64-6.36"/><path d="M21 3v6h-6"/></symbol>
        <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></symbol>
        <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></symbol>
        <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12"/><path d="M7 11l5 5 5-5"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
        <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></symbol>
    </svg>

    <!-- 資金看板：手機是下方抽屜，電腦是左側欄 -->
    <aside id="gd" class="sheet" aria-label="資金看板">
        <div class="handle"></div>
        <div class="gd-head">
            <span class="ic-box"><svg class="ic"><use href="#i-chart"/></svg></span>
            <b>資金看板</b>
            <span id="gd-pill" class="gd-pill"></span>
            <button class="icon-btn gd-close" data-close aria-label="關閉"><svg class="ic"><use href="#i-close"/></svg></button>
        </div>
        <div class="gd-grid">
            <div>
                <p class="lbl">清單總投入（自動加總）</p>
                <div class="field" id="gd-principal-disp">—</div>
            </div>
            <div>
                <p class="lbl">歷史已實現損益</p>
                <input class="field" type="number" step="any" id="gd-realized" placeholder="+/-" inputmode="decimal">
            </div>
            <div>
                <p class="lbl">目標總獲利（自動估算）</p>
                <div class="field" id="gd-target-profit-disp">—</div>
            </div>
            <div>
                <p class="lbl">浮動損益（自動）</p>
                <div class="field" id="gd-float">—</div>
            </div>
        </div>
        <div class="gd-total">
            <span class="lbl">目前總獲利</span>
            <span id="gd-total-profit">--</span>
        </div>
        <div class="bar">
            <div class="bar-top">
                <span>漲幅進度（%）</span>
                <span id="gd-bar-a-pct"></span>
                <span>目標 100%</span>
            </div>
            <div class="bar-track">
                <div class="bar-fill" id="gd-bar-a-fill"></div>
                <div class="bar-dot" id="gd-bar-a-dot"></div>
            </div>
            <div class="bar-bot">
                <span>0%</span>
                <span id="gd-bar-a-mid"></span>
                <span>100%</span>
            </div>
        </div>
        <div class="bar">
            <div class="bar-top">
                <span>資金進度（USDT）</span>
                <span id="gd-bar-b-lbl"></span>
                <span id="gd-bar-b-right"></span>
            </div>
            <div class="bar-track">
                <div class="bar-fill" id="gd-bar-b-fill"></div>
                <div class="bar-dot" id="gd-bar-b-dot"></div>
            </div>
            <div class="bar-bot">
                <span id="gd-bar-b-l">$0</span>
                <span id="gd-bar-b-m"></span>
                <span id="gd-bar-b-r">--</span>
            </div>
        </div>
        <p class="gd-note" id="gd-note"></p>
    </aside>

    <!-- 頂部 -->
    <header class="topbar" id="topbar">
        <div class="topbar-row">
            <div class="brand">
                <h1>策略看板</h1>
                <span class="mode-tag" id="mode-tag">訪客</span>
            </div>
            <div class="desk-tools">
                <label class="search-box">
                    <svg class="ic"><use href="#i-search"/></svg>
                    <input type="search" id="desktopSearchInput" placeholder="搜尋幣種或備註" autocomplete="off">
                    <kbd>/</kbd>
                </label>
                <button class="tool-btn" id="desk-sort-btn" data-action="sort-menu">
                    <svg class="ic"><use href="#i-sort"/></svg><span id="desk-sort-label">排序</span>
                </button>
                <div class="seg" role="group" aria-label="檢視方式">
                    <button data-view="card" aria-label="卡片檢視"><svg class="ic"><use href="#i-grid"/></svg>卡片</button>
                    <button data-view="list" aria-label="列表檢視"><svg class="ic"><use href="#i-list"/></svg>列表</button>
                </div>
            </div>
            <div class="top-actions">
                <button class="status" id="status" data-state="loading" title="點一下立即更新報價">
                    <span class="dot"></span><span id="status-text">更新中…</span>
                </button>
                <button class="icon-btn" data-action="notif" aria-label="通知中心">
                    <svg class="ic"><use href="#i-bell"/></svg>
                    <span class="badge" id="notif-badge"></span>
                </button>
                <button class="icon-btn" data-action="settings" aria-label="設定">
                    <svg class="ic"><use href="#i-menu"/></svg>
                </button>
            </div>
        </div>
        <div class="chips-wrap">
            <div id="chip-row" class="chips" role="group" aria-label="狀態篩選"></div>
        </div>
    </header>

    <!-- 內容 -->
    <main id="main">
        <button class="summary" id="summary" data-action="gd" aria-label="打開資金看板">
            <span class="ic-box"><svg class="ic"><use href="#i-chart"/></svg></span>
            <span class="sum-txt">
                <span class="lbl">目前總獲利</span>
                <span class="sum-v" id="gd-sum-total">--</span>
            </span>
            <span class="sum-p" id="gd-sum-pill"></span>
            <svg class="ic sum-arrow"><use href="#i-chevron"/></svg>
        </button>
        <div id="coin-container" class="view-card">
            <div class="empty">
                <div class="spinner"></div>
                <p>正在同步行情…</p>
            </div>
        </div>
    </main>

    <!-- 手機底部操作列 -->
    <nav class="pill" id="pill">
        <button class="pill-btn" data-action="sort-menu"><svg class="ic"><use href="#i-sort"/></svg>排序</button>
        <button class="pill-btn" data-action="toggle-view" id="pill-view-btn"><svg class="ic"><use href="#i-list"/></svg><span>列表</span></button>
        <button class="pill-btn" data-action="search" aria-label="搜尋"><svg class="ic"><use href="#i-search"/></svg>搜尋</button>
        <div class="pill-search">
            <svg class="ic"><use href="#i-search"/></svg>
            <input type="search" id="searchInput" placeholder="搜尋幣種或備註" autocomplete="off">
            <button data-action="search-close" aria-label="關閉搜尋"><svg class="ic"><use href="#i-close"/></svg></button>
        </div>
    </nav>

    <div id="overlay" class="overlay"></div>

    <!-- 排序 -->
    <div id="sort-menu" class="sheet sort-menu" aria-label="排序">
        <div class="handle"></div>
        <p class="sec-title">排序條件</p>
        <div id="sort-opts"></div>
        <p class="sec-title view-title">檢視方式</p>
        <div class="seg seg-full" role="group" aria-label="檢視方式">
            <button data-view="card"><svg class="ic"><use href="#i-grid"/></svg>卡片</button>
            <button data-view="list"><svg class="ic"><use href="#i-list"/></svg>列表</button>
        </div>
    </div>

    <!-- 幣種詳情／編輯 -->
    <div id="bottom-sheet" class="sheet" aria-label="幣種詳情">
        <div class="handle"></div>
        <button class="icon-btn sheet-close" data-close aria-label="關閉"><svg class="ic"><use href="#i-close"/></svg></button>
        <div id="sheet-content"></div>
    </div>

    <!-- 通知中心 -->
    <div id="notif-panel" class="drawer" aria-label="通知中心">
        <div class="drawer-head">
            <h2>通知中心</h2>
            <button class="icon-btn" data-close aria-label="關閉"><svg class="ic"><use href="#i-close"/></svg></button>
        </div>
        <div class="drawer-sub">
            <span class="lbl">事件紀錄</span>
            <button class="link-btn danger" data-action="clear-notif" id="clear-notif-btn">清除</button>
        </div>
        <div id="notif-list"></div>
    </div>

    <!-- 設定 -->
    <div id="side-panel" class="drawer" aria-label="設定">
        <div class="drawer-head">
            <h2>設定</h2>
            <button class="icon-btn" data-close aria-label="關閉"><svg class="ic"><use href="#i-close"/></svg></button>
        </div>

        <div id="sync-status" class="sync-status">訪客觀看模式</div>

        <section class="sec" id="sec-bin">
            <h3>雲端區塊</h3>
            <div class="row-input">
                <input type="text" id="sync-bin" placeholder="Bin ID" autocomplete="off" spellcheck="false">
                <button class="btn btn-sm" data-action="guest-refresh" id="guest-refresh-btn"><svg class="ic"><use href="#i-refresh"/></svg>讀取</button>
            </div>
        </section>

        <section class="sec" id="sec-login">
            <h3>管理員登入</h3>
            <form id="login-form" class="stack" autocomplete="off">
                <input type="text" id="admin-user" placeholder="帳號" autocomplete="off" autocapitalize="off" spellcheck="false">
                <input type="password" id="admin-pass" placeholder="密碼" autocomplete="off">
                <button type="submit" class="btn primary" id="login-btn">登入</button>
            </form>
            <div id="logout-box" class="stack" hidden>
                <p class="hint">已用管理員身分登入。</p>
                <button class="btn danger" data-action="logout">登出</button>
            </div>
        </section>

        <section class="sec" id="admin-tools" hidden>
            <h3>管理工具</h3>
            <div class="stack">
                <button class="btn" data-action="add-coin"><svg class="ic"><use href="#i-plus"/></svg>新增幣種</button>
                <button class="btn" data-action="fetch-cloud"><svg class="ic"><use href="#i-download"/></svg>從雲端讀取</button>
                <button class="btn" data-action="force-push"><svg class="ic"><use href="#i-upload"/></svg>強制上傳雲端（覆蓋）</button>
                <button class="btn" data-action="create-bin" id="create-bin-btn"><svg class="ic"><use href="#i-plus"/></svg>建立全新公開區塊</button>
            </div>
        </section>

        <section class="sec">
            <h3>推播通知</h3>
            <div class="stack">
                <button class="btn" data-action="browser-notify" id="browser-notify-btn"><svg class="ic"><use href="#i-bell"/></svg>開啟瀏覽器通知</button>
                <p class="hint">開啟後，雲端有新的進場／達標／止損通知時，這台裝置會跳出提醒。</p>
            </div>
            <details class="fold">
                <summary>Telegram 推播測試<svg class="ic"><use href="#i-chevron"/></svg></summary>
                <div class="stack">
                    <label class="lbl" for="tg-token">Telegram Bot Token</label>
                    <input type="text" id="tg-token" placeholder="Bot Token" autocomplete="off" spellcheck="false">
                    <label class="lbl" for="tg-chatid">Telegram Chat ID</label>
                    <input type="text" id="tg-chatid" placeholder="Chat ID" autocomplete="off" spellcheck="false">
                    <div class="row-2">
                        <button class="btn" data-action="tg-save">儲存</button>
                        <button class="btn" data-action="tg-test"><svg class="ic"><use href="#i-send"/></svg>測試推播</button>
                    </div>
                    <p class="hint">這裡的設定只存在這台裝置，用來發送測試訊息；到價通知由雲端程式負責。</p>
                </div>
            </details>
            <p id="notify-status" class="hint status-line"></p>
        </section>

        <section class="sec">
            <h3>資料備份</h3>
            <div class="row-2">
                <button class="btn" data-action="export"><svg class="ic"><use href="#i-download"/></svg>匯出 JSON</button>
                <button class="btn" data-action="import"><svg class="ic"><use href="#i-upload"/></svg>匯入 JSON</button>
            </div>
        </section>

        <p class="version" id="version-line"></p>
    </div>

    <!-- 對話框 -->
    <div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <form class="dialog-box" id="dialog-form">
            <h3 id="dialog-title"></h3>
            <p id="dialog-msg"></p>
            <input type="text" id="dialog-input" autocomplete="off">
            <div class="dialog-actions">
                <button type="button" class="btn" id="dialog-cancel">取消</button>
                <button type="submit" class="btn primary" id="dialog-ok">確定</button>
            </div>
        </form>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
